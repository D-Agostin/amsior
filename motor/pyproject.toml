[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "amsior"
version = "0.1.0.dev0"
description = "Motor de cálculo do Amsior: calculadora e biblioteca didática de equações para engenharia química"
readme = "README.md"
license = { text = "Proprietária: todos os direitos reservados" }
authors = [{ name = "Ruan D'Agostin" }]
requires-python = ">=3.12"
# Faixas compatíveis; as versões exatas testadas estão em requirements-lock.txt
dependencies = [
    "sympy>=1.14,<1.15",
    "mpmath>=1.3,<1.4",
    "pint>=0.26,<0.27",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "hypothesis>=6.170,<7",
    "mypy>=2.3,<3",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["amsior*"]

[tool.setuptools.package-data]
"amsior.i18n" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false
files = ["amsior"]

[[tool.mypy.overrides]]
module = ["sympy.*", "mpmath.*"]
ignore_missing_imports = true
