# Amsior — integração contínua
# Testes do motor em Windows e Linux, Python 3.12 e 3.13; tipos, testes e
# compilação da interface; o protótipo de empacotamento e o executável do
# aplicativo no Windows, que se autotesta antes de virar artefato.
name: CI

on:
  push:
  pull_request:

jobs:
  motor:
    name: Motor (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: motor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependências travadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Tipos (mypy estrito)
        run: python -m mypy
      - name: Testes (unidade, corpus, ataque, propriedades)
        run: python -m pytest -q
      - name: Relatório de aceite da fase 1A
        run: python ../ferramentas/aceite_1a.py

  empacotamento-windows:
    name: Protótipo de empacotamento (Windows)
    runs-on: windows-latest
    needs: motor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependências travadas
        working-directory: ferramentas/empacotamento
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-empacotamento.txt
          python -m pip install -e ../../motor --no-deps
          python -m pip freeze > versoes-windows.txt
      - name: Gerar executável
        working-directory: ferramentas/empacotamento
        run: pyinstaller --noconfirm ola_amsior.spec
      - name: Rodar o executável
        working-directory: ferramentas/empacotamento
        run: .\dist\ola_amsior.exe > relatorio.json; Get-Content relatorio.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ola-amsior-windows
          path: |
            ferramentas/empacotamento/dist/ola_amsior.exe
            ferramentas/empacotamento/relatorio.json
            ferramentas/empacotamento/versoes-windows.txt

  interface:
    name: Interface (tipos, testes, compilação)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: npm ci
      - name: Tipos (TypeScript estrito)
        run: npm run tipos
      - name: Testes (Vitest)
        run: npm test
      - name: Compilação
        run: npm run build

  app-windows:
    name: Aplicativo Amsior (Windows)
    runs-on: windows-latest
    needs: [motor, interface]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - name: Compilar a interface
        working-directory: interface
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependências travadas
        working-directory: ferramentas/empacotamento
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-empacotamento.txt
          python -m pip install -e ../../motor --no-deps
      - name: Gerar Amsior.exe
        working-directory: ferramentas/empacotamento
        run: pyinstaller --noconfirm amsior.spec
      - name: Autoteste do executável (servidor, token, interface, cálculo em processo separado)
        working-directory: ferramentas/empacotamento
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\Amsior.exe -ArgumentList "--autoteste","--relatorio","relatorio-app.json" -Wait -PassThru
          Get-Content relatorio-app.json
          if ($p.ExitCode -ne 0) { throw "autoteste falhou (código $($p.ExitCode))" }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: amsior-windows
          path: |
            ferramentas/empacotamento/dist/Amsior.exe
            ferramentas/empacotamento/relatorio-app.json
