# Amsior — integração contínua
# Testes do motor em Windows e Linux, Python 3.12 e 3.13; tipos, testes e
# compilação da interface; o site com o motor no navegador (Pyodide), que só é
# publicado se der exatamente as mesmas respostas do Python nativo (fase 1C).
# O protótipo de empacotamento fica até o fim da fase 1C (decisão 0006).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  motor:
    name: Motor (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: motor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependências travadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Tipos (mypy estrito)
        run: python -m mypy
      - name: Testes (unidade, corpus, ataque, propriedades)
        run: python -m pytest -q
      - name: Relatório de aceite da fase 1A
        run: python ../ferramentas/aceite_1a.py

  empacotamento-windows:
    name: Protótipo de empacotamento (Windows)
    runs-on: windows-latest
    needs: motor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependências travadas
        working-directory: ferramentas/empacotamento
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-empacotamento.txt
          python -m pip install -e ../../motor --no-deps
          python -m pip freeze > versoes-windows.txt
      - name: Gerar executável
        working-directory: ferramentas/empacotamento
        run: pyinstaller --noconfirm ola_amsior.spec
      - name: Rodar o executável
        working-directory: ferramentas/empacotamento
        run: .\dist\ola_amsior.exe > relatorio.json; Get-Content relatorio.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ola-amsior-windows
          path: |
            ferramentas/empacotamento/dist/ola_amsior.exe
            ferramentas/empacotamento/relatorio.json
            ferramentas/empacotamento/versoes-windows.txt

  interface:
    name: Interface (tipos, testes, compilação)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: npm ci
      - name: Tipos (TypeScript estrito)
        run: npm run tipos
      - name: Testes (Vitest)
        run: npm test
      - name: Compilação
        run: npm run build

  site:
    name: Site (motor no navegador × Python nativo)
    runs-on: ubuntu-latest
    needs: [motor, interface]
    steps:
      - uses: actions/checkout@v6
      - name: Python 3.14 (mesma versão do Pyodide, para o bytecode do motor)
        id: py314
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependências travadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r motor/requirements-lock.txt
          python -m pip install -e motor --no-deps
      - name: Montar o motor para o navegador
        env:
          AMSIOR_PYTHON_PYODIDE: ${{ steps.py314.outputs.python-path }}
        run: python ferramentas/web/montar_motor.py
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - name: Compilar o site
        working-directory: interface
        run: |
          npm ci
          npm run build
      - name: Mesmas respostas no navegador e no Python nativo (exemplos e corpus de isolar)
        run: |
          python ferramentas/web/comparar.py pedidos "$RUNNER_TEMP/pedidos.json"
          (cd interface && node ferramentas/motor-node.mjs "$RUNNER_TEMP/pedidos.json" > "$RUNNER_TEMP/pyodide.json")
          python ferramentas/web/comparar.py comparar "$RUNNER_TEMP/pedidos.json" "$RUNNER_TEMP/pyodide.json" comparacao-navegador.json
      - name: Site no Chrome (isolar com certificados, nada para fora do site, funcionar sem internet)
        run: |
          python -m pip install -r ferramentas/web/requirements-teste.txt
          (cd interface && npx vite preview --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          python ferramentas/web/teste_navegador.py http://localhost:4173/ teste-navegador.json
      - name: Site no Firefox (informativo)
        continue-on-error: true
        env:
          NAVEGADOR: firefox
        run: |
          python -m playwright install --with-deps firefox
          python ferramentas/web/teste_navegador.py http://localhost:4173/ teste-navegador-firefox.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: comparacao-navegador
          path: |
            comparacao-navegador.json
            teste-navegador.json
            teste-navegador-firefox.json
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: interface/dist

  publicar:
    name: Publicar no GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5
