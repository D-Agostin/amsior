#
# Cada fonte uma vez, na última edição (D-09, seção 8.1 da especificação).
# As fichas citam pelo id. Números de equação e de página só valem para a
# edição registrada aqui.
#
# Regra D-05: nada é preenchido de memória. Edição e ano vêm da consulta às
# editoras de 13/11/2026 (seção 8.1); ISBN fica nulo até Ruan conferir com o
# livro em mãos e preencher `conferido`.
#
# Campos:
#   papel     base (livro-base de uma área) | apoio
#   uso       citacao (só cita; texto próprio) | adaptacao (licença aberta:
#             pode adaptar texto, exemplos e figuras, com crédito)
#   licenca   identificador SPDX, só para obras abertas
#   versao    obras sem edição numerada: data publicada e versão do código-fonte
