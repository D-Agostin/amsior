exemplos:
  - enunciado: {pt: "Reação de 1ª ordem, densidade constante: isole a conversão \\(X\\) em \\(\\tau = \\frac{X}{k(1 - X)}\\)."}
    equacao: '\tau = \frac{X}{k(1 - X)}'
    simbolos:
      - {simbolo: '\tau', grandeza: tempo_espacial}
      - {simbolo: X, grandeza: conversao}
      - {simbolo: k, grandeza: constante_velocidade_primeira_ordem}
    pede: X
    esperado: ['X = \frac{\tau k}{\tau k + 1}']
  - enunciado: {pt: "Na equação de projeto de 1ª ordem escrita com o volume, isole a conversão \\(X\\)."}
    equacao: 'V = \frac{F_{A0} X}{k C_{A0} (1 - X)}'
    simbolos:
      - {simbolo: V, grandeza: volume}
      - {simbolo: 'F_{A0}', grandeza: vazao_molar}
      - {simbolo: X, grandeza: conversao}
      - {simbolo: k, grandeza: constante_velocidade_primeira_ordem}
      - {simbolo: 'C_{A0}', grandeza: concentracao_molar}
    pede: X
    esperado: ['X = \frac{C_{A0} V k}{C_{A0} V k + F_{A0}}']

